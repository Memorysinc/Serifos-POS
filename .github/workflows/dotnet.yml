name: Sefiros POS CI (.NET 10)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore .\FirewallControl.sln

      - name: Build solution (Release)
        run: dotnet build .\FirewallControl.sln --configuration Release --no-restore

      - name: Run unit & WPF verification tests
        run: dotnet test .\FirewallControl.sln --configuration Release --no-build --verbosity normal
